name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily security audit

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: spicegarden/backend

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies (scripts disabled)
        run: npm ci --ignore-scripts
      - name: Run npm audit (high severity gate)
        run: npm audit --audit-level=high
      - name: Run Snyk (if available)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --severity-threshold=high

  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies (scripts disabled)
      run: npm ci --ignore-scripts
    
    - name: Run lint
      run: npm run lint
    
    - name: Run unit tests
      run: npm run test:unit -- --passWithNoTests
    
    - name: Run backend coverage gate
      run: npm run test:cov
      working-directory: apps/backend
    
    - name: Run integration tests
      run: npm run test:integration -- --passWithNoTests
    
    - name: Run contract tests
      run: npm run test:e2e -- --passWithNoTests
    
    - name: Build application
      run: npm run build
    
    - name: Run load test (quick check)
      run: |
        npm run test:load -- --vus 10 --duration 30s
      continue-on-error: true
    
    - name: Docker build and push
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/develop' && 'develop' || 'main' }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
      env:
        DOCKER_USERNAME: ${{ github.actor }}
        DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    - name: Scan image for vulnerabilities
      if: github.ref == 'refs/heads/main'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'

  deploy-staging:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Substitute image tag and deploy to staging
        env:
          IMAGE_TAG: develop
        run: |
          sed -i "s|\${IMAGE_TAG:-develop}|${IMAGE_TAG}|g" infra/k8s/staging.yaml
          kubectl apply -f infra/k8s/staging.yaml -n spicegarden-staging --create-namespace
      
      - name: Wait for staging deployment
        run: |
          kubectl wait --for=condition=available --timeout=120s deployment/spicegarden-backend-staging -n spicegarden-staging
      
      - name: Run smoke tests
        run: |
          kubectl rollout status deployment/spicegarden-backend-staging -n spicegarden-staging --timeout=60s
      
      - name: Run integration validation
        run: |
          kubectl get pods -n spicegarden-staging -l app=spicegarden-backend -o jsonpath='{.items[0].metadata.name}' | xargs -I {} kubectl exec -n spicegarden-staging {} -- npm run test:integration -- --passWithNoTests || true

  deploy-production:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.spicegarden.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Set Kubernetes context
        uses: azure/k8s-set-context@v2
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      
      - name: Substitute image tag and apply manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|:latest|:${IMAGE_TAG}|g" infra/k8s/production-hardened.yaml
          kubectl apply -f infra/k8s/production-hardened.yaml -n spicegarden-production --create-namespace
      
      - name: Wait for rollout
        run: |
          kubectl wait --for=condition=available --timeout=180s deployment/spicegarden-backend -n spicegarden-production
          kubectl rollout status deployment/spicegarden-backend -n spicegarden-production --timeout=120s
      
      - name: Run smoke tests
        run: |
          kubectl get pods -n spicegarden-production -l app=spicegarden-backend -o jsonpath='{.items[0].metadata.name}' | xargs -I {} kubectl exec -n spicegarden-production {} -- curl -f http://localhost:3001/health
      
      - name: Verify autoscaling
        run: |
          kubectl get hpa -n spicegarden-production
          kubectl describe hpa -n spicegarden-production
      
      - name: Verify backup CronJob
        run: |
          kubectl get cronjob -n spicegarden-production
      
      - name: Notify deployment
        run: |
          echo "Production deployment completed for ${{ github.sha }}"

  deploy-mobile:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v6
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Build Android app bundle
        run: eas build --platform android --profile production --non-interactive
        env:
          EAS_BUILD_PROFILE: production

      - name: Build iOS app
        run: eas build --platform ios --profile production --non-interactive
        env:
          EAS_BUILD_PROFILE: production

      - name: Submit Android to Play Store
        run: eas submit --platform android --profile production --non-interactive
        env:
          EAS_BUILD_PROFILE: production
        continue-on-error: true

      - name: Submit iOS to App Store
        run: eas submit --platform ios --profile production --non-interactive
        env:
          EAS_BUILD_PROFILE: production
        continue-on-error: true

      - name: Notify mobile deployment
        run: echo "Mobile deployment completed for ${{ github.sha }}"