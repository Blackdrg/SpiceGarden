services:
  backend:
    image: spicegarden/backend:${TAG:-latest}
    build:
      context: .
      dockerfile: ./infra/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://spicegarden.com,https://www.spicegarden.com}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS_FILE=/run/secrets/db_pass
      - DB_NAME=spicegarden
      - MONGO_URI=mongodb://${MONGO_USER:-spicegarden}:${MONGO_PASS}@mongo:27017/spicegarden?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CLUSTER_MODE=false
      - REDIS_RATE_LIMIT_REQUIRED=true
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - ENCRYPTION_SECRET_FILE=/run/secrets/encryption_secret
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - FCM_SERVER_KEY_FILE=/run/secrets/fcm_server_key
      - APNS_PRIVATE_KEY_FILE=/run/secrets/apns_private_key
      - SENTRY_DSN=${SENTRY_DSN}
      - SMTP_HOST=${SMTP_HOST:-smtp.sendgrid.net}
      - SMTP_USER=${SMTP_USER:-apikey}
      - SMTP_PASS_FILE=/run/secrets/smtp_pass
      - TWILIO_ACCOUNT_SID_FILE=/run/secrets/twilio_account_sid
      - TWILIO_AUTH_TOKEN_FILE=/run/secrets/twilio_auth_token
      - GOOGLE_MAPS_API_KEY_FILE=/run/secrets/google_maps_api_key
    secrets:
      - db_pass
      - jwt_secret
      - encryption_secret
      - fcm_server_key
      - apns_private_key
      - smtp_pass
      - twilio_account_sid
      - twilio_auth_token
      - google_maps_api_key
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1)).end()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - spicegarden-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  customer-web:
    image: spicegarden/customer-web:${TAG:-latest}
    build:
      context: .
      dockerfile: ./infra/customer-web/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.spicegarden.com
      - NEXT_PUBLIC_SOCKET_URL=https://api.spicegarden.com
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1)).end()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - spicegarden-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  restaurant-dashboard:
    image: spicegarden/restaurant-dashboard:${TAG:-latest}
    build:
      context: .
      dockerfile: ./infra/restaurant-dashboard/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.spicegarden.com
      - NEXT_PUBLIC_SOCKET_URL=https://api.spicegarden.com
    depends_on:
      - backend
    networks:
      - spicegarden-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2

  super-admin:
    image: spicegarden/super-admin:${TAG:-latest}
    build:
      context: .
      dockerfile: ./infra/super-admin/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.spicegarden.com
    depends_on:
      - backend
    networks:
      - spicegarden-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 1

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=spicegarden
      - POSTGRES_USER=${POSTGRES_USER:-spicegarden}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spicegarden}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spicegarden-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G

  mongo:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-spicegarden}
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_password
    secrets:
      - mongo_password
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spicegarden-net
    # mongosh retained as native MongoDB healthcheck tool (official mongo:7 image ships mongosh)
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - spicegarden-net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - customer-web
      - restaurant-dashboard
      - super-admin
      - backend
    networks:
      - spicegarden-net
    deploy:
      replicas: 2

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - spicegarden-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  grafana:
    image: grafana/grafana-enterprise:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - spicegarden-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    entrypoint: ["/bin/sh", "/etc/alertmanager/generate-config.sh"]
    command: []
    volumes:
      - ./infra/alertmanager/generate-config.sh:/etc/alertmanager/generate-config.sh:ro
      - ./infra/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY:-}
    networks:
      - spicegarden-net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-Opensearch#2026!}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-Opensearch#2026!}
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - spicegarden-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2G

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
    depends_on:
      - opensearch
    networks:
      - spicegarden-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

secrets:
  db_pass:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  encryption_secret:
    file: ./secrets/encryption_secret.txt
  fcm_server_key:
    file: ./secrets/fcm_server_key.txt
  apns_private_key:
    file: ./secrets/apns_private_key.txt
  smtp_pass:
    file: ./secrets/sendgrid_api_key.txt
  twilio_account_sid:
    file: ./secrets/twilio_account_sid.txt
  twilio_auth_token:
    file: ./secrets/twilio_auth_token.txt
  google_maps_api_key:
    file: ./secrets/google_maps_api_key.txt
  mongo_password:
    file: ./secrets/mongo_password.txt

networks:
  spicegarden-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: spicegarden-br0

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  opensearch_data:
    driver: local
