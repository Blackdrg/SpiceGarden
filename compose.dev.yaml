services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=spicegarden
      - POSTGRES_USER=spicegarden
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-spicegarden_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spicegarden -d spicegarden"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spicegarden-net

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "notice"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - spicegarden-net

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spicegarden-net

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - spicegarden-net

  grafana:
    image: grafana/grafana-enterprise:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - spicegarden-net

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-admin}
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - spicegarden-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
    depends_on:
      - opensearch
    networks:
      - spicegarden-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - spicegarden-net

  backend:
    build:
      context: .
      dockerfile: ./infra/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - LOCAL_DB=sqlite
      - CORS_ALLOWED_ORIGINS=http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005
      - JWT_SECRET=${JWT_SECRET:-spicegarden_dev_jwt_secret_at_least_32_chars}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-spicegarden_dev_encryption_secret_32_chars}
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-spicegarden}
      - DB_PASS=${DB_PASS:-spicegarden_dev_password}
      - DB_NAME=spicegarden
      - MONGO_URI=mongodb://mongo:27017/spicegarden
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT_REDIS_REQUIRED=false
      - PAYMENT_PRIMARY_GATEWAY=stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_local_dev_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_test_local_dev_placeholder}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_local_dev_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-local_dev_placeholder}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-local_dev_placeholder}
      - SENTRY_DSN=${SENTRY_DSN}
      - SMTP_HOST=${SMTP_HOST:-smtp.sendgrid.net}
      - SMTP_USER=${SMTP_USER:-apikey}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@spicegarden.com}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-+15555555555}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - spicegarden-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    tmpfs:
      - /tmp

  customer-web:
    build:
      context: .
      dockerfile: ./infra/customer-web/Dockerfile
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.spicegarden.com
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - spicegarden-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  restaurant-dashboard:
    build:
      context: .
      dockerfile: ./infra/restaurant-dashboard/Dockerfile
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.spicegarden.com
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - spicegarden-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  super-admin:
    build:
      context: .
      dockerfile: ./infra/super-admin/Dockerfile
    ports:
      - "3004:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.spicegarden.com
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - spicegarden-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  delivery-partner:
    profiles: ["mobile-web-smoke"]
    build:
      context: .
      dockerfile: ./infra/delivery-partner/Dockerfile
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - API_URL=https://api.spicegarden.com
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - spicegarden-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

networks:
  spicegarden-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: spicegarden-br0

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  prometheus_data:
  grafana_data:
  opensearch_data: