apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicegarden-backend-blue
  labels:
    app: spicegarden-backend
    environment: production
    variant: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spicegarden-backend
      variant: blue
  template:
    metadata:
      labels:
        app: spicegarden-backend
        environment: production
        variant: blue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "ghcr.io/spicegarden/backend:${IMAGE_TAG:-latest}"
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              protocol: TCP
          envFrom:
            - secretRef:
                name: spicegarden-secrets
            - configMapRef:
                name: spicegarden-config
          env:
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            - name: DEPLOYMENT_VARIANT
              value: "blue"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
