apiVersion: v1
kind: ConfigMap
metadata:
  name: spicegarden-storage-config
  namespace: spicegarden-production
  labels:
    app: spicegarden-backend
data:
  AWS_REGION: "us-east-1"
  S3_BUCKET: "spicegarden-uploads"
  S3_ENDPOINT: "https://s3.us-east-1.amazonaws.com"
  S3_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  S3_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  UPLOAD_MAX_SIZE_MB: "50"
  UPLOAD_STORAGE_CLASS: "STANDARD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicegarden-object-storage-migration
  namespace: spicegarden-production
  labels:
    app: spicegarden-storage-migration
spec:
  replicas: 1
  strategy:
    type: Job
  selector:
    matchLabels:
      app: spicegarden-storage-migration
  template:
    metadata:
      labels:
        app: spicegarden-storage-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: ghcr.io/spicegarden/backend:${IMAGE_TAG:-latest}
          command: ["npx", "ts-node", "-e", "require('./src/services/storage/migrate-to-s3').run()"]
          envFrom:
            - secretRef:
                name: spicegarden-secrets
            - configMapRef:
                name: spicegarden-storage-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL