apiVersion: v1
kind: ServiceAccount
metadata:
  name: spicegarden-backend
  namespace: spicegarden-production
  labels:
    app: spicegarden-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spicegarden-backend
  labels:
    app: spicegarden-backend
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spicegarden-backend
  namespace: spicegarden-production
  labels:
    app: spicegarden-backend
subjects:
  - kind: ServiceAccount
    name: spicegarden-backend
    namespace: spicegarden-production
roleRef:
  kind: ClusterRole
  name: spicegarden-backend
  apiGroup: rbac.authorization.k8s.io