apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spicegarden-prod-ingress
  labels:
    app: spicegarden
    environment: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
spec:
  tls:
    - hosts:
        - api.spicegarden.com
        - www.spicegarden.com
        - spicegarden.com
        - restaurant.spicegarden.com
        - admin.spicegarden.com
      secretName: spicegarden-prod-tls
  rules:
    - host: api.spicegarden.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spicegarden-backend
                port:
                  number: 80
    - host: www.spicegarden.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-web
                port:
                  number: 80
    - host: spicegarden.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-web
                port:
                  number: 80
    - host: restaurant.spicegarden.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restaurant-dashboard
                port:
                  number: 80
    - host: admin.spicegarden.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: super-admin
                port:
                  number: 80
    - http:
        paths:
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: spicegarden-static
                port:
                  number: 80
