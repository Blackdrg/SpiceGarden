apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicegarden-backend
  labels:
    app: spicegarden-backend
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: spicegarden-backend
  template:
    metadata:
      labels:
        app: spicegarden-backend
        environment: production
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "ghcr.io/spicegarden/backend:${IMAGE_TAG:-latest}"
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              protocol: TCP
          envFrom:
            - secretRef:
                name: spicegarden-secrets
            - configMapRef:
                name: spicegarden-config
          env:
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: tmp-volume
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - spicegarden-backend
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: spicegarden-backend
  labels:
    app: spicegarden-backend
spec:
  selector:
    app: spicegarden-backend
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spicegarden-backend-pdb
  labels:
    app: spicegarden-backend
spec:
  minAvailable: 2
  maxUnavailable: 1
  selector:
    matchLabels:
      app: spicegarden-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spicegarden-backend-hpa
  labels:
    app: spicegarden-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spicegarden-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spicegarden-backend-ingress
  labels:
    app: spicegarden-backend
spec:
  podSelector:
    matchLabels:
      app: spicegarden-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-controller
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 3001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spicegarden-backend-egress
  labels:
    app: spicegarden-backend
spec:
  podSelector:
    matchLabels:
      app: spicegarden-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              name: spicegarden-data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 27017
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spicegarden-backup
  labels:
    app: spicegarden-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 30
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          containers:
            - name: backup
              image: alpine:3.19
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  BACKUP_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  tar -czf "/backup/spicegarden_${BACKUP_TIMESTAMP}.tar.gz" -C /backup/dumps postgres.sql mongo redis.rdb
                  if [ -n "${BACKUP_ENCRYPTION_KEY:-}" ]; then
                    openssl aes-256-cbc -salt -in "/backup/spicegarden_${BACKUP_TIMESTAMP}.tar.gz" -out "/backup/spicegarden_${BACKUP_TIMESTAMP}.tar.gz.enc" -k "${BACKUP_ENCRYPTION_KEY}"
                    rm "/backup/spicegarden_${BACKUP_TIMESTAMP}.tar.gz"
                    echo "Backup encrypted: /backup/spicegarden_${BACKUP_TIMESTAMP}.tar.gz.enc"
                  else
                    echo "Backup created: /backup/spicegarden_${BACKUP_TIMESTAMP}.tar.gz"
                  fi
                  if [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] && [ -n "${AWS_S3_BUCKET:-}" ]; then
                    aws s3 cp "/backup/spicegarden_${BACKUP_TIMESTAMP}.tar.gz${BACKUP_ENCRYPTION_KEY:+.enc}" "s3://${AWS_S3_BUCKET}/backups/"
                    echo "Backup uploaded to S3"
                  else
                    echo "S3 upload skipped: AWS credentials not configured"
                  fi
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: postgres-user
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: postgres-db
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: postgres-password
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: redis-password
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: backup-encryption-key
                      optional: true
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: aws-access-key-id
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: aws-secret-access-key
                      optional: true
                - name: AWS_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: aws-s3-bucket
                      optional: true
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
                - name: dumps
                  mountPath: /backup/dumps
          restartPolicy: OnFailure
          initContainers:
            - name: postgres-dump
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pg_dump -U $POSTGRES_USER -d $POSTGRES_DB -h postgres > /dumps/postgres.sql
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: postgres-user
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: postgres-db
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: postgres-password
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
            - name: mongo-dump
              image: mongo:7
              command: ["/bin/sh", "-c"]
              args:
                - |
                  mongodump --host mongo -d spicegarden --out /dumps/mongo
                  mv /dumps/mongo/spicegarden/* /dumps/mongo/
                  rmdir /dumps/mongo/spicegarden
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
            - name: redis-dump
              image: redis:7-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  redis-cli -h redis -a "$REDIS_PASSWORD" SAVE
                  redis-cli -h redis -a "$REDIS_PASSWORD" --rdb /dumps/redis.rdb
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: spicegarden-secrets
                      key: redis-password
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: spicegarden-backup-pvc
            - name: dumps
              emptyDir: {}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-type
                        operator: In
                        values:
                          - backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spicegarden-backup-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard-backup
---
apiVersion: batch/v1