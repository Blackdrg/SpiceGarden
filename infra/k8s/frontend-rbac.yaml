apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-web
  namespace: spicegarden-production
  labels:
    app: customer-web
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: customer-web
  namespace: spicegarden-production
  labels:
    app: customer-web
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: customer-web
  namespace: spicegarden-production
  labels:
    app: customer-web
subjects:
  - kind: ServiceAccount
    name: customer-web
    namespace: spicegarden-production
roleRef:
  kind: Role
  name: customer-web
  apiGroup: rbac.authorization.k8s.io
