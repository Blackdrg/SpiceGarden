apiVersion: v1
kind: ConfigMap
metadata:
  name: spicegarden-config
  labels:
    app: spicegarden-backend
data:
  LOG_LEVEL: "info"
  ENABLE_SWAGGER: "false"
  DB_CONNECTION_POOL_SIZE: "50"
  DB_CONNECTION_POOL_MAX: "100"
  DB_CONNECTION_POOL_IDLE_TIMEOUT: "30000"
  DB_CONNECTION_POOL_ACQUIRE_TIMEOUT: "60000"
  MONGO_CONNECTION_POOL_MAX: "100"
  MONGO_CONNECTION_POOL_MIN: "10"
  REDIS_CLUSTER_MODE: "true"
  REDIS_CLUSTER_NODES: "redis-cluster-0.redis-headless:6379,redis-cluster-1.redis-headless:6379,redis-cluster-2.redis-headless:6379,redis-cluster-3.redis-headless:6379,redis-cluster-4.redis-headless:6379,redis-cluster-5.redis-headless:6379"
  ENABLE_METRICS: "true"