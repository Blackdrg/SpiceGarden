# WARNING: This file contains placeholder values. Do NOT apply directly with `kubectl apply`.
# Use envsubst or a CI/CD pipeline to substitute actual secret values before applying.
# Example: envsubst < infra/k8s/secrets.yaml | kubectl apply -f -
# Or use: kubectl create secret generic spicegarden-secrets --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: spicegarden-secrets
  labels:
    app: spicegarden-backend
type: Opaque
stringData:
  postgres-user: "spicegarden"
  postgres-password: "${POSTGRES_PASSWORD}"
  postgres-db: "spicegarden"
  mongo-password: "${MONGO_PASSWORD}"
  redis-password: "${REDIS_PASSWORD}"
  jwt-secret: "${JWT_SECRET}"
  api-key: "${API_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: spicegarden-secrets-staging
  labels:
    app: spicegarden-backend
type: Opaque
stringData:
  postgres-user: "spicegarden"
  postgres-password: "${POSTGRES_PASSWORD_STAGING}"
  postgres-db: "spicegarden_staging"
  redis-password: "${REDIS_PASSWORD_STAGING}"
  jwt-secret: "${JWT_SECRET_STAGING}"
  api-key: "${API_KEY_STAGING}"