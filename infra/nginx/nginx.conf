worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  types_hash_max_size 2048;
  server_tokens off;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml;
  gzip_comp_level 6;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self';" always;

  # Upstreams
  upstream backend {
    server backend:3001 max_fails=3 fail_timeout=30s;
  }

  upstream customer_web {
    server customer-web:3000 max_fails=3 fail_timeout=30s;
  }

  upstream restaurant_dashboard {
    server restaurant-dashboard:3000 max_fails=3 fail_timeout=30s;
  }

  upstream super_admin {
    server super-admin:3000 max_fails=3 fail_timeout=30s;
  }

  # SSL Configuration
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # API Server
  server {
    listen 80;
    server_name api.spicegarden.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.spicegarden.com;

    ssl_certificate /etc/nginx/ssl/spicegarden.crt;
    ssl_certificate_key /etc/nginx/ssl/spicegarden.key;

    location / {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }

    location /auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /health {
      access_log off;
      proxy_pass http://backend;
    }
  }

  # Customer Web
  server {
    listen 80;
    server_name www.spicegarden.com spicegarden.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name www.spicegarden.com spicegarden.com;

    ssl_certificate /etc/nginx/ssl/spicegarden.crt;
    ssl_certificate_key /etc/nginx/ssl/spicegarden.key;

    location / {
      proxy_pass http://customer_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Restaurant Dashboard
  server {
    listen 80;
    server_name restaurant.spicegarden.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name restaurant.spicegarden.com;

    ssl_certificate /etc/nginx/ssl/spicegarden.crt;
    ssl_certificate_key /etc/nginx/ssl/spicegarden.key;

    location / {
      proxy_pass http://restaurant_dashboard;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Super Admin
  server {
    listen 80;
    server_name admin.spicegarden.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name admin.spicegarden.com;

    ssl_certificate /etc/nginx/ssl/spicegarden.crt;
    ssl_certificate_key /etc/nginx/ssl/spicegarden.key;

    location / {
      proxy_pass http://super_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
