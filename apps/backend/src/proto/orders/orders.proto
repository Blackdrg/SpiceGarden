syntax = "proto3";
package spicegarden.orders.v1;

service OrderService {
  rpc PlaceOrder(PlaceOrderRequest) returns (OrderResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc GetUserOrders(GetUserOrdersRequest) returns (OrdersListResponse);
  rpc ConfirmPayment(ConfirmPaymentRequest) returns (OrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (OrderResponse);
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc RetryOrder(RetryOrderRequest) returns (OrderResponse);
}

message PlaceOrderRequest {
  string user_id = 1;
  string restaurant_id = 2;
  repeated OrderItem items = 3;
  double subtotal = 4;
  double tax = 5;
  double delivery_fee = 6;
  double discount = 7;
  double tip = 8;
  double grand_total = 9;
  string coupon_id = 10;
  string delivery_address_id = 11;
  string idempotency_key = 12;
}

message OrderItem {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 quantity = 4;
  string image = 5;
}

message OrderResponse {
  string id = 1;
  string order_number = 2;
  string status = 3;
  string payment_status = 4;
  double grand_total = 5;
  string user_id = 6;
  string restaurant_id = 7;
  repeated OrderItem items = 8;
  string created_at = 9;
}

message GetUserOrdersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message OrdersListResponse {
  repeated OrderResponse orders = 1;
  int32 total = 2;
  bool has_more = 3;
}

message GetOrderRequest {
  string order_id = 1;
}

message ConfirmPaymentRequest {
  string order_id = 1;
  string payment_id = 2;
}

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  string status = 2;
  int32 actual_time_minutes = 3;
  string failure_reason = 4;
}

message VerifyOTPRequest {
  string order_id = 1;
  string otp = 2;
  string driver_id = 3;
}

message VerifyOTPResponse {
  bool valid = 1;
}

message RetryOrderRequest {
  string order_id = 1;
}
