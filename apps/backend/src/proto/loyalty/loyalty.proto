syntax = "proto3";
package spicegarden.loyalty.v1;

service LoyaltyService {
  rpc CreateCoupon(CreateCouponRequest) returns (CouponResponse);
  rpc ApplyCoupon(ApplyCouponRequest) returns (ApplyCouponResponse);
  rpc GetCoupons(GetCouponsRequest) returns (CouponsListResponse);
  rpc GetCouponAnalytics(GetCouponAnalyticsRequest) returns (CouponAnalyticsResponse);
  rpc DeactivateCoupon(DeactivateCouponRequest) returns (CouponResponse);
  rpc GenerateReferralCode(GenerateReferralRequest) returns (ReferralCodeResponse);
  rpc ProcessReferral(ProcessReferralRequest) returns (ReferralProcessResponse);
  rpc GetReferralHistory(GetReferralHistoryRequest) returns (ReferralHistoryResponse);
  rpc ProcessCashback(ProcessCashbackRequest) returns (CashbackResponse);
  rpc GetCashbackSummary(GetCashbackRequest) returns (CashbackResponse);
}

message CreateCouponRequest {
  string code = 1;
  string discount_type = 2;
  double discount_value = 3;
  int32 max_uses = 4;
  string valid_from = 5;
  string valid_until = 6;
}

message CouponResponse {
  string id = 1;
  string code = 2;
  bool is_active = 3;
  string created_at = 4;
}

message ApplyCouponRequest {
  string code = 1;
  string user_id = 2;
  double order_amount = 3;
  string order_id = 4;
}

message ApplyCouponResponse {
  string coupon_id = 1;
  double discount_amount = 2;
  double final_amount = 3;
  string message = 4;
}

message GetCouponsRequest {
  int32 page = 1;
  int32 limit = 2;
  bool active_only = 3;
}

message CouponsListResponse {
  repeated CouponResponse coupons = 1;
  int32 total = 2;
}

message GetCouponAnalyticsRequest {
  string coupon_id = 1;
}

message CouponAnalyticsResponse {
  string coupon_id = 1;
  int32 total_uses = 2;
  double total_revenue = 3;
  int32 unique_users = 4;
}

message DeactivateCouponRequest {
  string coupon_id = 1;
}

message GenerateReferralRequest {
  string user_id = 1;
}

message ReferralCodeResponse {
  string code = 1;
  string user_id = 2;
  string created_at = 3;
}

message ProcessReferralRequest {
  string code = 1;
  string referee_id = 2;
  string first_order_id = 3;
}

message ReferralProcessResponse {
  string referral_id = 1;
  double reward_amount = 2;
  string status = 3;
}

message GetReferralHistoryRequest {
  string user_id = 1;
}

message ReferralHistoryResponse {
  repeated ReferralProcessResponse referrals = 1;
}

message ProcessCashbackRequest {
  string user_id = 1;
  string order_id = 2;
  double order_amount = 3;
}

message CashbackResponse {
  string user_id = 1;
  double cashback_amount = 2;
  string status = 3;
}

message GetCashbackRequest {
  string user_id = 1;
}
